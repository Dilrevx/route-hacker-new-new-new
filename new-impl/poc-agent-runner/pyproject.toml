[project]
name = "route-hacker-poc-agent-runner"
version = "0.1.0"
description = "Autonomous PoC agent and independent verifier runner"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/route_hacker", "src/cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
